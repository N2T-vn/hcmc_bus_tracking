services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_SERVER: host.docker.internal
      DB_PORT: ${DB_HOST_PORT:-1433}
      DB_DATABASE: BusGPS
      DB_BUS_TABLE: dbo.bus_waypoints
      DB_AUTH_MODE: sql
      DB_USER: bus_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_ENCRYPT: "false"
      DB_TRUST_CERT: "true"
      DB_REQUEST_TIMEOUT_MS: 30000
      SPEED_MULTIPLIER: ${SPEED_MULTIPLIER:-30}
      TRAJECTORY_WINDOW_SECONDS: ${TRAJECTORY_WINDOW_SECONDS:-900}
      CORS_ORIGIN: http://localhost:${FRONTEND_HOST_PORT:-5173}
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-1000}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
